name: 流程变更声明

# 为什么需要它
#   2026-09-15 实测：审计线程在 50 分钟里白干了约 15 分钟 ——
#   它手动 ssh 部署、手动逐个 gh pr update-branch，而这两件事
#   在 PR #15 合并后**已经自动化**（deploy.yml / sync-pr-branches.yml）。
#   根因不是它慢，是**没人通知它流程变了**：基础设施类 PR 合并后，
#   其他线程仍按老习惯干活，而习惯是写在文档和记忆里的。
#
#   所以：改了基础设施的 PR，必须在描述里显式声明「改变了哪些流程」。
#   这是给**下一个线程**留的路标，不是形式主义。
#
# 触发范围（只在改了这些路径时才检查）
#   .github/**  scripts/**  AGENTS.md
#   docs/collaboration.md  docs/branch-flow-rules.md  docs/skill-engineering.md

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  flow-change-declaration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 判断是否改了基础设施
        id: infra
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed=$(git diff --name-only "$base" "$head" || true)
          echo "本次改动文件："
          echo "$changed"
          hit=false
          if printf '%s\n' "$changed" | grep -qE '^(\.github/|scripts/|AGENTS\.md$|docs/(collaboration|branch-flow-rules|skill-engineering)\.md$)'; then
            hit=true
          fi
          echo "hit=$hit" >> "$GITHUB_OUTPUT"
          echo "基础设施改动：$hit"

      - name: 检查 PR 描述是否声明流程变更
        if: steps.infra.outputs.hit == 'true'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          if printf '%s' "$PR_BODY" | grep -qE '^#{2,3} *流程变更'; then
            echo "✓ 已声明流程变更"
            exit 0
          fi
          echo "::error::这个 PR 改了基础设施（.github / scripts / AGENTS.md / 协作文档），但描述里没有「## 流程变更」一节。"
          echo "::error::请补上这一节，写明它改变了哪些既有习惯或流程（没有改变就写「无」）。"
          echo ""
          echo "原因：其他线程按文档和记忆里的习惯干活。基础设施变了而不声明，"
          echo "它们会继续做已经自动化掉的事 —— 2026-09-15 实测因此白干约 15 分钟。"
          echo ""
          echo "模板："
          echo "## 流程变更"
          echo ""
          echo "- 之前怎么做：…"
          echo "- 现在怎么做：…"
          echo "- 受影响的线程/文档：…"
          echo "（没有流程变化就写「无」）"
          exit 1

      - name: 未改基础设施
        if: steps.infra.outputs.hit != 'true'
        run: echo "本 PR 未改动基础设施路径，跳过流程变更检查。"
