name: 流程变更声明

# 为什么需要它
#   2026-09-15 实测：审计线程在 50 分钟里白干了约 15 分钟 ——
#   它手动 ssh 部署、手动逐个 gh pr update-branch，而这两件事
#   在 PR #15 合并后**已经自动化**（deploy.yml / sync-pr-branches.yml）。
#   根因不是它慢，是**没人通知它流程变了**：基础设施类 PR 合并后，
#   其他线程仍按老习惯干活，而习惯是写在文档和记忆里的。
#
#   所以：改了基础设施的 PR，必须在描述里显式声明「改变了哪些流程」。
#   这是给**下一个线程**留的路标，不是形式主义。
#
# 触发范围（只在改了这些路径时才检查）
#   .github/**  scripts/**  AGENTS.md
#   docs/collaboration.md  docs/branch-flow-rules.md  docs/skill-engineering.md
#
# 2026-09-15 更晚：从「check 失败」改成「在 PR 上留 comment」。
#   原因：它是**流程提醒**，不是**质量门禁**，用 failure 表达提醒是语义错位 ——
#   红叉让审计线程以为这个 PR 坏了（实测 #35 / #40 都因此被多看一眼），
#   而它其实完全不影响合并（分支保护只要求 build）。
#   现在 check 恒绿，提醒改在 PR 对话里出现，且**补上声明后会自动删除**。

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write   # 需要写权限：在 PR 上留 / 更新 / 删除提醒 comment

jobs:
  flow-change-declaration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 判断是否改了基础设施
        id: infra
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed=$(git diff --name-only "$base" "$head" || true)
          echo "本次改动文件："
          echo "$changed"
          hit=false
          if printf '%s\n' "$changed" | grep -qE '^(\.github/|scripts/|AGENTS\.md$|docs/(collaboration|branch-flow-rules|skill-engineering)\.md$)'; then
            hit=true
          fi
          echo "hit=$hit" >> "$GITHUB_OUTPUT"
          echo "基础设施改动：$hit"

      - name: 缺声明时在 PR 上留提醒（check 不再变红）
        if: steps.infra.outputs.hit == 'true'
        uses: actions/github-script@v7
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        with:
          script: |
            // 用固定 marker 保证幂等：同一 PR 上只有一条提醒，补上声明后自动删除。
            const MARKER = "<!-- flow-change-reminder -->";
            const body = process.env.PR_BODY || "";
            const declared = /^#{2,3} *流程变更/m.test(body);

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments, { owner, repo, issue_number }
            );
            const mine = comments.find((c) => (c.body || "").includes(MARKER));

            if (declared) {
              if (mine) {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: mine.id });
                core.info("已声明流程变更，删除此前的提醒。");
              } else {
                core.info("已声明流程变更。");
              }
              return;
            }

            const text = [
              MARKER,
              "## ⚠️ 这个 PR 改了基础设施，但描述里没有「## 流程变更」一节",
              "",
              "改了 `.github/` / `scripts/` / `AGENTS.md` / 协作文档之一。",
              "",
              "**这不是错误，是提醒** —— 其他线程按文档和记忆里的习惯干活；",
              "基础设施变了而不声明，它们会继续做**已经自动化掉**的事",
              "（2026-09-15 实测因此白干约 15 分钟）。",
              "",
              "补上这一节即可（没有流程变化就写「无」）：",
              "",
              "```markdown",
              "## 流程变更",
              "",
              "- 之前怎么做：…",
              "- 现在怎么做：…",
              "- 受影响的线程 / 需要同步的文档：…",
              "```",
              "",
              "> 本条由 `pr-flow-check.yml` 自动维护；补上声明后会自行删除。",
            ].join("\n");

            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body: text });
              core.info("已更新提醒 comment。");
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: text });
              core.info("已创建提醒 comment。");
            }

      - name: 未改基础设施
        if: steps.infra.outputs.hit != 'true'
        run: echo "本 PR 未改动基础设施路径，跳过流程变更检查。"
