name: 部署到生产

# 为什么需要它
#   在这之前，部署是审计/上线线程手工做的：ssh 进去 → reset → build → restart。
#   它本身不慢（实测合并到线上约 17 分钟），但它占的是**单点线程的注意力**，
#   而那个人同时还要审 PR、解冲突、跑预检。把部署摘出去，等于给瓶颈腾出容量。
#
# 安全设计（重要）
#   Actions 里存着一把能登录生产机的私钥。生产机是多站点共用机
#   （同机还有 ans.cauai.fun / sub2api / omniroute），所以这把 key **不是** root 通用 key：
#   它在服务器 /root/.ssh/authorized_keys 里被限制为
#       restrict,command="/usr/local/bin/no2zhihu-deploy.sh"
#   实测：拿这把 key 执行 `id` 只会触发部署脚本，拿不到 shell。
#   也就是说私钥即使泄漏，攻击面也只有「触发一次部署」，碰不到别的站点。
#
# 幂等
#   部署脚本自己判断「已经是最新 main 且服务正常」时直接跳过构建，
#   所以连续合并多个 PR 只会真正构建一次。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 串行部署；不取消进行中的那一次（避免把构建打断成半成品）。
# 排队中的多余运行会被脚本自身的「已是最新就跳过」挡掉，成本接近零。
concurrency:
  group: deploy-no2zhihu
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # 部署后要用仓库里的冒烟脚本验线上，所以需要 checkout
      - uses: actions/checkout@v4

      - name: 检查 secrets 是否齐备
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          missing=0
          for v in DEPLOY_SSH_KEY DEPLOY_HOST DEPLOY_USER; do
            if [ -z "${!v:-}" ]; then echo "::error::缺少仓库 secret：$v"; missing=1; fi
          done
          [ "$missing" = "0" ] || exit 1
          echo "secrets 齐备"

      - name: 准备受限部署密钥
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # runner 每次都是干净环境，用 keyscan 填 known_hosts
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "密钥就绪"

      - name: 触发部署（受限 key 只能跑部署脚本）
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          # -T：服务器侧 restrict 禁用了 PTY，不请求就不会有告警
          # ServerAlive*：构建 1–3 分钟，别让空闲连接被中间设备掐断
          ssh -T -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 \
              -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
              "$DEPLOY_USER@$DEPLOY_HOST" 2>&1 | tee /tmp/deploy.log
          if ! grep -qE 'RESULT=(deployed|up-to-date)' /tmp/deploy.log; then
            echo "::error::部署脚本没有返回成功标记 RESULT=..."
            exit 1
          fi

      # ────────────────────────────────────────────────────────────────
      # 部署后冒烟：与 CI 用同一份 scripts/smoke.mjs。
      # 之前这里只探 /api/health —— 那只能说明「进程活着」，
      # 说明不了「页面还能打开、鉴权还在」。现在换成完整的 8 项断言，
      # 且因为与 CI 同源，「CI 绿而这里红」能直接指向部署/环境问题。
      # ────────────────────────────────────────────────────────────────
      - name: 线上冒烟检查（与 CI 同一份脚本）
        run: |
          set -uo pipefail
          node scripts/smoke.mjs --base https://zhihu.cauai.fun --retries 8 --retry-wait 6000 \
            || { echo "::error::线上冒烟未通过 —— 服务已部署但行为不对，请查看服务器 journalctl -u no2zhihu"; exit 1; }

      - name: 清理临时密钥
        if: always()
        run: rm -f ~/.ssh/deploy_key
